youtube:
  playlist_ids:
    #- "PL6YVF-LNNIQZKBcG17-p1Jh1U6X9xGj-g"
    #- "PLLA-cMc71Xr3HLMAvSQ4gmoqqsNcdo1Yj&index=21"
    #- "PL6YVF-LNNIQYZpKz3IlGEjK_2Nn6P1ZI0" # office
    - "PL6YVF-LNNIQZxzIqbS4OEquMNoASC7Zb4" # traffic
    #- "PL6YVF-LNNIQYDHgI3qV9Y3t9_49X1-spZ" # ambient
  max_videos_per_playlist: 1000 # 1 for debug

quality_validation:
  min_audio_length_ms: 1000
  max_audio_length_ms: 600000000
  min_energy_db: -40
  max_energy_db: -10

quality_validation_basic:
  min_audio_length_ms: 500
  max_audio_length_ms: 600000000
  min_energy_db: -80
  check_readability: true

preprocessing:
  target_sample_rate: 16000
  target_rms_db: -20
  length_adjustment:
    min_ms: 1000
    max_ms: 30000
  normalization:
    method: "rms"
    target_db: -20
    headroom_db: 3

quality_validation_strict:
  min_audio_length_ms: 1000
  max_audio_length_ms: 30000
  min_energy_db: -40
  max_energy_db: -10
  require_sample_rate: 16000

stt:
  model: "whisper-base"
  language: "ko"
  min_confidence: 0.85
  device: "mps"

vad:
  model: "pyannote/segmentation"
  threshold: 0.5
  min_speech_duration_ms: 300

synthesis:
  snr_levels_db: [5, 10, 15, 20, 25]
  noise_types: ["ambient", "traffic", "office"]
  noise_distribution:
    ambient: 0.4
    traffic: 0.3
    office: 0.3

output_dirs:
  raw_downloads: "./backend/data_generation/raw_downloads/noise/traffic"

reproducibility:
  seed: 42
  version: "1.0"


# python backend/data_generation/src/_1_download_youtube.py --config ./backend/data_generation/config/noise_download.yaml
